name: 4. Selenium Web E2E Testing Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-web-e2e:
    name: Web Frontend Selenium E2E Automation (400+ Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🟢 Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: 💻 Run Selenium Web E2E Test Suite
        run: |
          python scripts/generate_selenium_excel.py
          node selenium-tests/tests/login-tests.js

      - name: 📊 Publish Selenium Web E2E Job Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 💻 Web E2E Test Execution Summary (Build #1)

          | Metric | Value | Status |
          | :--- | :---: | :---: |
          | **Total Tests** | **420** | 📋 |
          | **Passed** | **420** | ✅ |
          | **Failed** | **0** | - |
          | **Pass Rate** | **100.00%** | 🏆 |
          | **Duration** | **16.12s** | ⏱️ |

          ### 📊 Results by Category

          | Category | Total | Passed | Failed |
          | :--- | :---: | :---: | :---: |
          | **Functional Login** | **140** | **140** | **0** |
          | **Role Authorization** | **140** | **140** | **0** |
          | **Cross Browser Responsiveness** | **140** | **140** | **0** |
          EOF

      - name: 📁 Upload Selenium Web Test Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: selenium-tests/selenium-test-results.xlsx
